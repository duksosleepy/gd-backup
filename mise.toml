[settings]
experimental = true

[tools]
node = "25.2.1"
pitchfork = "2.32.2"
pnpm = "10.33.2"
python = "3.13"
uv = "latest"

[env]
ENVIRONMENT = "production"
NODE_ENV = "production"
PYTHONOPTIMIZE = "1"
HOST = "0.0.0.0"
PORT = "8100"

[tasks."build:frontend"]
description = "Build web dashboard static assets for production"
dir = "frontend"
run = "pnpm build"

[tasks.build]
description = "Build all project assets for production"
depends = ["build:frontend"]

[tasks.test]
description = "Run pytest test suite"
run = "uv run pytest"

[tasks.start]
description = "Start all services in production"
run = "mise daemons start"

[tasks.stop]
description = "Stop all background services"
run = "mise daemons stop"

[tasks.status]
description = "Check status of background services"
run = "mise daemons status"

[tasks.logs]
description = "Stream logs from background services"
run = "mise daemons logs -f"

[daemons.backup]
run = "uv run backup.py"
ready_port = 8100

[daemons.frontend]
dir = "frontend"
run = "pnpm exec vite preview --host 0.0.0.0 --port 4173 --outDir ../core/static"
ready_port = 4173
depends = ["backup"]

