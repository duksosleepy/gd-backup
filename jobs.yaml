# GD Backup Jobs Configuration
# Define custom backup jobs here. The service automatically creates and schedules
# an orchestrator pipeline and dashboard cards for each configured job.

jobs:
  - id: "L60SANGTAM"
    name: "L60SANGTAM"
    description: "Backup latest .zip from L60SANGTAM_HRM and L60SANGTAM databases to Google Drive"
    credentials_file: "credentials.json"
    token_file: "token.json"
    target_folder: "backup"
    cron: "0 5 * * *" # Daily at 5:00 AM
    enabled: true
    sources:
      - name: "L60SANGTAM_HRM"
        path: 'E:\LINKQ\Database\BACKUP\SQL2017EN\L60SANGTAM_HRM'
        pattern: "*.zip"
      - name: "L60SANGTAM"
        path: 'E:\LINKQ\Database\BACKUP\SQL2017EN\L60SANGTAM'
        pattern: "*.zip"
