[project]
name = "gd-backup"
version = "0.1.0"
description = "Google Drive Automated Backup Service with Web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler==3.11.3",
    "alembic>=1.14.0",
    "apprise>=1.8.0",
    "authlib>=1.3.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "itsdangerous>=2.1.2",
    "jinja2>=3.1.0",
    "python-socketio>=5.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "SQLAlchemy>=2.0.0",
    "uvicorn>=0.30.0",
    "uuid6>=2024.0.0",
    "httpx2>=2.12.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
