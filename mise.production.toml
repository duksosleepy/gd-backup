[env]
ENVIRONMENT = "production"
NODE_ENV = "production"
PYTHONOPTIMIZE = "1"
HOST = "0.0.0.0"
PORT = "8100"

[daemons.backup]
run = "uv run backup.py"
ready_port = 8100

[daemons.frontend]
dir = "frontend"
run = "pnpm exec vite preview --host 0.0.0.0 --port 4173 --outDir ../core/static"
ready_port = 4173
depends = ["backup"]

